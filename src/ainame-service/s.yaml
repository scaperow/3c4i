edition: 3.0.0
name: start-next14-v3
vars:
  region: 'cn-zhangjiakou'
  functionName: 'start-nextjs14-zdhh'
template:
  start-next-template:
    internetAccess: true
    # logConfig: auto
    # vpcConfig: auto
resources:
  start-nextjs14:
    component: fc3
    actions:
      pre-deploy:
        - run: export PATH=/usr/local/versions/node/v20.8.1/bin:$PATH && npm install --registry=https://registry.npmmirror.com 
          path: ./code 
        - run: export PATH=/usr/local/versions/node/v20.8.1/bin:$PATH && npm run build
          path: ./code
    props:
      region: ${vars.region}
      description: nextjs14
      timeout: 600
      diskSize: 512
      customRuntimeConfig:
        port: 3000
        command:
          - bootstrap
      layers:
        - acs:fc:${vars.region}:official:layers/Nodejs20/versions/1
      runtime: custom.debian10
      instanceConcurrency: 100
      memorySize: 3072
      role: AliyunFCDefaultRole
      cpu: 2
      environmentVariables:
        NODE_PATH: /opt/nodejs/node_modules
        Region: ${vars.region}
        PATH: >-
          /opt/nodejs20/bin::/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin:/opt/nodejs/node_modules/.bin
      functionName: ${vars.functionName}
      code: ./code
      triggers:
        - description: ''
          qualifier: LATEST
          triggerName: defaultTrigger
          triggerType: http
          triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
            authType: anonymous
            disableURLInternet: false
    extend:
      name: start-next-template
  start-next-domain:
    component: fc3-domain
    props:
      region: ${vars.region}
      domainName: auto
      protocol: HTTP
      routeConfig:
        routes:
          - path: /*
            functionName: ${vars.functionName}